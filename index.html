<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirschtarmy Liga</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen">
<div class="max-w-5xl mx-auto p-6">

<h1 class="text-3xl font-bold text-center mb-6">🎯 Kirschtarmy Liga</h1>

<!-- LOGIN -->
<div class="bg-gray-800 p-4 rounded mb-6 text-center">
<input id="email" placeholder="Email" class="p-2 text-black rounded mb-2 w-60">
<input id="password" type="password" placeholder="Passwort" class="p-2 text-black rounded mb-2 w-60">
<br>
<button id="loginBtn" class="bg-green-600 px-3 py-2 rounded">Login</button>
<button id="logoutBtn" class="bg-red-600 px-3 py-2 rounded">Logout</button>
<p id="status" class="mt-2 text-sm text-red-400"></p>
</div>

<!-- LIGA -->
<div class="flex justify-center gap-3 mb-4">
<button class="ligaBtn bg-blue-600 px-3 py-2 rounded" data-liga="liga1">Liga 1</button>
<button class="ligaBtn bg-purple-600 px-3 py-2 rounded" data-liga="liga2">Liga 2</button>
<button class="ligaBtn bg-green-600 px-3 py-2 rounded" data-liga="liga3">Liga 3</button>
<button class="ligaBtn bg-red-600 px-3 py-2 rounded" data-liga="liga4">Liga 4</button>
</div>

<h2 id="ligaTitle" class="text-xl text-center mb-4"></h2>

<!-- SPIELER -->
<div class="bg-gray-800 p-4 rounded mb-6">
<h3 class="mb-2">👥 Spieler</h3>
<ul id="players"></ul>
<button id="addPlayer" class="bg-green-600 px-3 py-2 rounded mt-3 hidden">+ Spieler</button>
</div>
