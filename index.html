<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirschtarmy 1.0</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen">
<div class="max-w-6xl mx-auto p-6">

<h1 class="text-4xl font-bold text-center mb-8">🎯 Kirschtarmy 1.0</h1>

<div class="bg-gray-800 p-4 rounded-xl mb-6 text-center">
<input id="email" type="email" placeholder="Email" class="p-2 text-black rounded mb-2 w-64">
<input id="password" type="password" placeholder="Passwort" class="p-2 text-black rounded mb-2 w-64">
<div>
<button id="loginBtn" class="bg-green-600 px-4 py-2 rounded">Login</button>
<button id="logoutBtn" class="bg-red-600 px-4 py-2 rounded">Logout</button>
</div>
<p id="loginStatus" class="mt-2 text-sm text-red-400"></p>
</div>

<div class="flex justify-center gap-4 mb-6">
<button data-liga="liga1" class="ligaBtn bg-blue-600 px-4 py-2 rounded">Liga 1</button>
<button data-liga="liga2" class="ligaBtn bg-purple-600 px-4 py-2 rounded">Liga 2</button>
<button data-liga="liga3" class="ligaBtn bg-green-600 px-4 py-2 rounded">Liga 3</button>
<button data-liga="liga4" class="ligaBtn bg-red-600 px-4 py-2 rounded">Liga 4</button>
</div>

<h2 id="ligaTitle" class="text-2xl text-center mb-4"></h2>

<div class="bg-gray-800 p-6 rounded-xl mb-8">
<h3>👥 Spieler</h3>
<ul id="playerList"></ul>
<button id="addPlayerBtn" class="bg-green-600 px-4 py-2 rounded hidden mt-3">+</button>
</div>

<div class="bg-gray-800 p-6 rounded-xl mb-8">
<h3>🗓 Spiel hinzufügen</h3>

<select id="heimSelect" class="text-black p-2"></select>
<select id="gastSelect" class="text-black p-2"></select>
<input id="spieltagInput" type="number" class="text-black p-2">
<input id="resultInput" placeholder="6:4" class="text-black p-2">

<br><br>

<button id="addMatchBtn" class="bg-blue-600 px-4 py-2 rounded hidden">Speichern</button>

<table class="w-full mt-4 text-center">
<thead>
<tr><th>Tag</th><th>Heim</th><th>Gast</th><th>Ergebnis</th></tr>
</thead>
<tbody id="matchTable"></tbody>
</table>

</div>

<div class="bg-gray-800 p-6 rounded-xl">
<h3>📊 Tabelle</h3>

<table class="w-full text-center">
<thead>
<tr>
<th>Team</th><th>Sp</th><th>S</th><th>U</th>
<th>Leg+</th><th>Leg-</th><th>Diff</th><th>P</th>
</tr>
</thead>
<tbody id="leagueTable"></tbody>
</table>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDb87wTtntcY4VQ9WjekaA3CLYwW2bNrmQ",
authDomain: "kirschtarmyliga.firebaseapp.com",
projectId: "kirschtarmyliga",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let liga="liga1";
let isAdmin=false;

const admins=[
"janblut18@gmail.com",
"jaqueline.zeiser@web.de",
"kurka-sebastian@web.de"
].map(a=>a.toLowerCase());

loginBtn.onclick=async()=>{
try{
await signInWithEmailAndPassword(auth,email.value,password.value);
loginStatus.innerText="OK";
}catch(e){loginStatus.innerText=e.message;}
};

logoutBtn.onclick=()=>signOut(auth);

onAuthStateChanged(auth,(user)=>{
isAdmin=user && admins.includes((user.email||"").toLowerCase());
addMatchBtn.classList.toggle("hidden",!isAdmin);
addPlayerBtn.classList.toggle("hidden",!isAdmin);
});

document.querySelectorAll(".ligaBtn").forEach(b=>{
b.onclick=()=>{liga=b.dataset.liga;loadPlayers();listenMatches();}
});

addPlayerBtn.onclick=async()=>{
let n=prompt("Name");
if(!n) return;
await addDoc(collection(db,liga+"_players"),{name:n});
};

addMatchBtn.onclick=async()=>{
await addDoc(collection(db,liga+"_matches"),{
spieltag:Number(spieltagInput.value),
heim:heimSelect.value,
gast:gastSelect.value,
result:resultInput.value
});
};

async function loadPlayers(){
playerList.innerHTML="";
heimSelect.innerHTML="";
gastSelect.innerHTML="";

let snap=await getDocs(collection(db,liga+"_players"));
snap.forEach(d=>{
let p=d.data().name;
playerList.innerHTML+=`<li>${p}</li>`;
heimSelect.innerHTML+=`<option>${p}</option>`;
gastSelect.innerHTML+=`<option>${p}</option>`;
});
}

function listenMatches(){

onSnapshot(collection(db,liga+"_matches"), (snap)=>{

matchTable.innerHTML="";
leagueTable.innerHTML="";

let tableData={};

document.querySelectorAll("#playerList li").forEach(li=>{
let p=li.innerText;
tableData[p]={
spiele:0,siege:0,unentschieden:0,
legsPlus:0,legsMinus:0,punkte:0
};
});

snap.forEach(d=>{
let m=d.data();

matchTable.innerHTML+=`
<tr>
<td>${m.spieltag}</td>
<td>${m.heim}</td>
<td>${m.gast}</td>
<td>${m.result}</td>
</tr>`;

if(!m.result.includes(":")) return;

let [h,a]=m.result.split(":").map(Number);
if(!tableData[m.heim]||!tableData[m.gast]) return;

tableData[m.heim].spiele++;
tableData[m.gast].spiele++;

tableData[m.heim].legsPlus+=h;
tableData[m.heim].legsMinus+=a;

tableData[m.gast].legsPlus+=a;
tableData[m.gast].legsMinus+=h;

if(h>a){
tableData[m.heim].siege++;
tableData[m.heim].punkte+=3;
}
else if(a>h){
tableData[m.gast].siege++;
tableData[m.gast].punkte+=3;
}
else{
tableData[m.heim].unentschieden++;
tableData[m.gast].unentschieden++;
tableData[m.heim].punkte++;
tableData[m.gast].punkte++;
}

});

let teams=Object.keys(tableData).sort((a,b)=>{
return tableData[b].punkte-tableData[a].punkte ||
(tableData[b].legsPlus-tableData[b].legsMinus) -
(tableData[a].legsPlus-tableData[a].legsMinus);
});

teams.forEach(t=>{
let d=tableData[t];
leagueTable.innerHTML+=`
<tr>
<td>${t}</td>
<td>${d.spiele}</td>
<td>${d.siege}</td>
<td>${d.unentschieden}</td>
<td>${d.legsPlus}</td>
<td>${d.legsMinus}</td>
<td>${d.legsPlus-d.legsMinus}</td>
<td>${d.punkte}</td>
</tr>`;
});

});
}

loadPlayers();
listenMatches();

</script>
</body>
</html>
